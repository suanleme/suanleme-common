[package]
name = "suanleme-common"
version = "0.1.63"
authors.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true

[dependencies]
suanleme-macro.workspace = true
suanleme-derive-macro.workspace = true
fusen-rs = "0.6.20"

#网络协议处理
tokio = { version = "1.44.1", features = ["full"] }
bytes = "1.10.1"

#json序列化
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.140"
serde_yaml = "0.9.34"

#nacos配置中心
nacos-sdk = { version = "0.4.3", features = ["default"] }

#日志处理
tracing = "0.1.41"
tracing-futures = { version = "0.2.5" }
tracing-subscriber = { version = "0.3.19", features = [
    "json",
    "env-filter",
    "local-time",
] }
pretty_env_logger = "0.5.0"
tracing-timing = "0.6.0"
tracing-appender = "0.2.3"
tracing-opentelemetry = "0.30.0"
opentelemetry = "0.29.0"
opentelemetry_sdk = { version = "0.29.0", features = [
    "rt-tokio",
    "rt-tokio-current-thread",
    "experimental_trace_batch_span_processor_with_async_runtime"
] }
opentelemetry-otlp = { version = "0.29.0", features = ["grpc-tonic"] }

#其他
lazy_static = "1.5.0"
toml = "0.8.20"
uuid = { version = "1.15.1", features = ["v4"] }

#时间
chrono = "0.4.40"

#redis
redis = { version = "0.29.1", features = [
    "tokio-comp",
    "connection-manager",
    "keep-alive",
] }
r2d2 = "0.8.10"

#加解密
rsa = "0.9.7"
sha2 = { version = "0.10.8", features = ["oid"] }
rand = "0.9.0"
base64 = "0.22.1"
ring = "0.17.12"
