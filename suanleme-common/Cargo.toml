[package]
name = "suanleme-common"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true

[dependencies]
suanleme-macro.workspace = true
suanleme-derive-macro.workspace = true
fusen-rs = "0.6.6"

#网络协议处理
tokio = { version = "1.38.1", features = ["full"] }
bytes = "1.7.1"

#json序列化
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0.120"
serde_yaml = "0.9.34"

#nacos配置中心
nacos-sdk = { version = "0.4.0", features = ["default"] }

#日志处理
log = "0.4.21"
tracing = "0.1.13"
tracing-futures = { version = "0.2.3" }
tracing-subscriber = { version = "0.3.18", features = ["json", "env-filter"] }
pretty_env_logger = "0.5.0"
tracing-appender = "0.2.3"
tracing-opentelemetry = "0.25.0"
opentelemetry = "0.24.0"
opentelemetry_sdk = { version = "0.24.1", features = ["rt-tokio"] }
opentelemetry-appender-tracing = "0.5.0"
opentelemetry-otlp = "0.17.0"
opentelemetry-jaeger = "0.22.0"

#其他
lazy_static = "1.5.0"
toml = "0.8.15"
uuid = { version = "1.10.0", features = ["v4"] }

#时间
chrono = "0.4.38"

#redis
redis = { version = "0.26.0", features = ["tokio-comp"] }

#加解密
rsa = "0.9.6"
sha2 = { version = "0.10.8", features = ["oid"] }
rand = "0.8.5"
base64 = "0.22.1"
ring = "0.17.8"
